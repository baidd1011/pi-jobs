name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test

  distribution:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Install Pi
        run: npm install --global @earendil-works/pi-coding-agent@0.82.1
      - name: Select package source
        id: source
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            "value=git:github.com/${{ github.repository }}@${{ github.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=$env:GITHUB_WORKSPACE" >> $env:GITHUB_OUTPUT
          }
      - name: Clean-machine acceptance
        shell: pwsh
        run: ./scripts/acceptance.ps1 -PackageSource '${{ steps.source.outputs.value }}'

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, distribution]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --verify-tag --generate-notes --title 'pi-jobs ${{ github.ref_name }}'
